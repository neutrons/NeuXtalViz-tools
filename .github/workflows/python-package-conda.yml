name: Python Package using Conda

on: [push]

env:
  PKG_NAME: neuxtalviz
  MODULE_NAME: NeuXtalViz

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Miniconda with nxv environment
      uses: conda-incubator/setup-miniconda@v3
      with:
        python-version: 3.12
        environment-file: environment.yml
        activate-environment: nxv

    - name: Install package in editable mode
      shell: bash -l {0}  # activate conda environment
      run: |
        python -m pip install -e .

    - name: Run tests with pytest
      shell: bash -l {0}  # ensures conda environment is active
      run: |
        pytest

  conda-build:
    name: Build conda package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Miniconda for conda-build
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: 3.12
          channels: conda-forge
          auto-update-conda: true

      - name: Install conda-build
        shell: bash -l {0}
        run: conda install -y conda-build anaconda-client

      - name: Compute package version
        shell: bash -l {0}
        run: |
          set -e
          pip install versioningit
          PKG_VERSION=$(python -m versioningit .)
          echo "Computed package version: ${PKG_VERSION}"
          if [ -z "${PKG_VERSION}" ]; then
            echo "Failed to compute package version with versioningit" >&2
            exit 1
          fi
          echo "PKG_VERSION=${PKG_VERSION}" >> "$GITHUB_ENV"

      - name: Build conda package
        shell: bash -l {0}
        run: |
          cat > /tmp/conda-variant.yaml <<EOF
          version:
            - "${PKG_VERSION}"
          EOF
          conda-build conda.recipe \
            -c conda-forge -c mantid/label/nightly -c oncat \
            --variant-config-files /tmp/conda-variant.yaml \
            --output-folder /tmp/local-channel

      - name: Install conda package
        id: install
        uses: neutrons/conda-actions/pkg-install@v2
        with:
          package-name: ${{ env.PKG_NAME }}
          local-channel: /tmp/local-channel
          extra-channels: mantid/label/nightly oncat
          python-version: "3.12"

      - name: Verify conda package
        uses: neutrons/conda-actions/pkg-verify@v2
        with:
          package-name: ${{ env.PKG_NAME }}
          module-name: ${{ env.MODULE_NAME }}
          conda-env-name: ${{ steps.install.outputs.conda_env }}

      - name: Upload conda package as artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact-conda-package
          path: /tmp/local-channel/noarch/${{ env.PKG_NAME }}-*.conda

  publish:
    name: Upload package to anaconda
    runs-on: ubuntu-latest
    needs: [build-linux, conda-build]
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    steps:
      - name: Set up Miniconda for publishing
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: 3.12
          channels: conda-forge
          auto-update-conda: true

      - name: Install anaconda-client
        shell: bash -l {0}
        run: conda install -y anaconda-client

      - name: Download conda package artifact
        uses: actions/download-artifact@v4
        with:
          name: artifact-conda-package

      - name: Upload package to anaconda
        uses: neutrons/conda-actions/publish@v2
        with:
          anaconda-token: ${{ secrets.ANACONDA_TOKEN }}
          organization: neutrons
          package-path: ${{ env.PKG_NAME }}-*.conda
          label: ${{ github.ref == 'refs/heads/main' && 'dev' || '' }}

      - name: Remove old packages
        if: github.ref == 'refs/heads/main'
        uses: neutrons/conda-actions/pkg-remove@v2
        with:
          anaconda_token: ${{ secrets.ANACONDA_TOKEN }}
          organization: neutrons
          package_name: ${{ env.PKG_NAME }}
          label: dev
          keep: 5